name: Publish BK standalone image
on:
  push:
    tags: ['bk-v*-standalone']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the tagged revision and publish to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#bk-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-standalone$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bk-pigeon:$version"
          revision="$(git rev-parse HEAD)"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 -f deploy/standalone/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image" .
          docker push "$image"

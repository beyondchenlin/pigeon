name: Publish BK standalone image
on:
  push:
    tags: ['bk-v*-standalone']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Publish or verify the tagged GHCR image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#bk-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-standalone$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bk-pigeon:$version"
          revision="$(git rev-parse HEAD)"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          pull_log="$RUNNER_TEMP/bk-image-pull.log"
          if docker pull --platform linux/amd64 "$image" 2>"$pull_log"; then
            docker image inspect "$image" | jq -e --arg sha "$revision" --arg version "$version" \
              --arg source "https://github.com/$GITHUB_REPOSITORY" '.[0] |
              .Os == "linux" and .Architecture == "amd64" and
              .Config.Labels["org.opencontainers.image.revision"] == $sha and
              .Config.Labels["org.opencontainers.image.version"] == $version and
              .Config.Labels["org.opencontainers.image.source"] == $source'
            container="$(docker create "$image")"
            trap 'docker rm -v "$container" >/dev/null' EXIT
            mkdir "$RUNNER_TEMP/bk-image-source"
            docker cp "$container:/opt/bk/server/." "$RUNNER_TEMP/bk-image-source/"
            for file in server/*.py; do
              cmp "$file" "$RUNNER_TEMP/bk-image-source/${file#server/}"
            done
            echo "Verified published $image at $revision"
            exit 0
          elif ! grep -Eiq 'manifest unknown|manifest_unknown|manifest.*not found|: not found$' "$pull_log"; then
            cat "$pull_log" >&2
            exit 1
          fi
          docker build --platform linux/amd64 -f deploy/standalone/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image" .
          docker push "$image"

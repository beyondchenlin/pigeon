[unix_http_server]
file=/run/service.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/service.sock

[supervisord]
childlogdir=/run
minfds=262144
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=error
nodaemon=true
silent=true
pidfile=/run/service.pid
user=root

[program:server]
numprocs                = 1
process_name            = %(program_name)s-%(process_num)s
command                 = python3 -u /user/phone-pilot/run_bk_server.py --port=880%(process_num)s
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 1000

[program:event]
command                 = python3 -u /user/phone-pilot/heartbeat_compat.py
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 1000

[program:frps]
command                 = python3 -u /user/phone-pilot/wait_auth_then_frps.py
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 100

[program:edge]
command                 = python3 -u -m executor.edge
autostart               = false
autorestart             = false
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 100

[program:auth]
command                 = python3 -u -m executor.auth
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 100

[program:cron]
command                 = python3 -u -m executor.cron
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 100

[program:mosquitto]
command                 = mosquitto -c /etc/mosquitto.conf
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/null
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 10

[program:pgbouncer]
user                    = nobody
command                 = /usr/local/bin/pgbouncer /etc/pgbouncer.ini
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 10

[program:openresty]
command                 = /usr/local/openresty/bin/openresty
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startretries            = 10000
priority                = 2000

[program:executor]
numprocs                = 1
process_name            = %(program_name)s-%(process_num)s
command                 = python3 -u /user/phone-pilot/run_bk_worker.py -l WARNING --pool solo --concurrency=1 --prefetch-multiplier=1 -n worker-%(process_num)02d@%%h --without-mingle --without-gossip
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 1000

[program:executor.beat]
command                 = celery --app=executor.celery beat -l INFO
autostart               = true
autorestart             = true
redirect_stderr         = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stdout_logfile_backups  = 0
startsecs               = 10
startretries            = 10000
priority                = 1000

[group:service]
programs=openresty,server,executor,executor.beat,event,mosquitto,edge,cron,frps,auth,pgbouncer

[include]
files = /etc/supervisor/conf.d/*.conf
